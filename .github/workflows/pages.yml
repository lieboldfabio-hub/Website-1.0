# Veroeffentlicht Kundenentwuerfe und Beispielprojekte als Vorschau.
# Erreichbar unter https://<benutzer>.github.io/Website-1.0/<ordner>/
name: Vorschau veroeffentlichen

on:
  push:
    branches: [main]
    paths: ['kunden/**', 'beispiele/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seiten zusammenstellen
        run: |
          mkdir -p _site
          cp -r kunden/* _site/
          cp -r beispiele/* _site/

          # Interne Unterlagen gehoeren nicht auf die Vorschau. Die README
          # enthaelt Verkaufsargumente und Notizen zum Kundengespraech, die
          # niemand ausser uns sehen soll.
          find _site \( -name '*.md' -o -name 'README.txt' \) -delete
          if find _site \( -name '*.md' -o -name 'README.txt' \) | grep .; then
            echo "Interne Unterlagen sind noch vorhanden, Abbruch."; exit 1
          fi
          echo "Interne Unterlagen entfernt."

          # Vorschau nicht indexieren lassen. Die Quelldateien bleiben
          # unveraendert und damit fuer die spaetere echte Domain korrekt.
          find _site -name '*.html' -print0 | xargs -0 sed -i \
            's|<meta name="robots" content="index, follow">|<meta name="robots" content="noindex, nofollow">|'
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

          # ---------------------------------------------------------------
          # Einstiegsseite. Listet Kundenprojekte und Beispiele getrennt.
          # ---------------------------------------------------------------
          python3 - <<'PY'
          import pathlib, html

          def eintraege(ordner):
              p = pathlib.Path(ordner)
              if not p.is_dir():
                  return []
              raus = []
              for d in sorted(x for x in p.iterdir() if x.is_dir()):
                  titel = d.name
                  idx = d / "index.html"
                  if idx.exists():
                      kopf = idx.read_text(encoding="utf-8", errors="ignore")[:4000]
                      if "<title>" in kopf:
                          t = kopf.split("<title>", 1)[1].split("</title>", 1)[0]
                          titel = t.split("|")[0].strip() or titel
                  raus.append((d.name, titel))
              return raus

          def block(ueberschrift, liste, leer):
              if not liste:
                  return f"<h2>{ueberschrift}</h2><p class='leer'>{leer}</p>"
              zeilen = "".join(
                  f"<a href='./{html.escape(o)}/'><b>{html.escape(t)}</b>"
                  f"<span>{html.escape(o)}</span></a>"
                  for o, t in liste
              )
              return f"<h2>{ueberschrift}</h2><div class='liste'>{zeilen}</div>"

          seite = f"""<!DOCTYPE html><html lang="de"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex, nofollow">
          <title>Website-Entwuerfe</title>
          <style>
          :root {{ color-scheme: light dark; }}
          body {{ font:16px/1.6 ui-sans-serif,system-ui,sans-serif; margin:0;
                 padding:clamp(2.5rem,7vw,5rem) 1.5rem; background:#f3f2ed; color:#12291e; }}
          main {{ max-width:44rem; margin:auto; }}
          h1 {{ font-size:clamp(1.7rem,1.2rem+2vw,2.4rem); letter-spacing:-.02em; margin:0 0 .6rem; }}
          .intro {{ color:#4e6157; margin:0 0 3rem; max-width:46ch; }}
          h2 {{ font-size:.78rem; letter-spacing:.16em; text-transform:uppercase;
               color:#8a7a4a; margin:2.75rem 0 1rem; }}
          .liste {{ display:grid; gap:.7rem; }}
          a {{ display:flex; align-items:baseline; justify-content:space-between; gap:1rem;
              padding:1.15rem 1.35rem; background:#fff; border:1px solid rgba(18,41,30,.12);
              border-radius:12px; text-decoration:none; color:inherit; transition:border-color .2s; }}
          a:hover {{ border-color:#e0a02c; }}
          a b {{ font-size:1.05rem; }}
          a span {{ color:#74857b; font-size:.85rem; font-family:ui-monospace,monospace; }}
          .leer {{ color:#74857b; }}
          .fuss {{ margin-top:3.5rem; padding-top:1.5rem; border-top:1px solid rgba(18,41,30,.12);
                  color:#74857b; font-size:.88rem; }}
          @media (prefers-color-scheme: dark) {{
            body {{ background:#0d2017; color:#eaf2ec; }}
            a {{ background:#163224; border-color:rgba(255,255,255,.12); }}
            .intro,.leer,a span,.fuss {{ color:#a9c2b5; }}
            .fuss {{ border-color:rgba(255,255,255,.12); }}
          }}
          </style></head><body><main>
          <h1>Website-Entwuerfe</h1>
          <p class="intro">Vorschauen zur Abstimmung. Nicht oeffentlich gelistet
          und von Suchmaschinen ausgenommen.</p>
          {block("Kundenprojekte", eintraege("kunden"), "Noch keine angelegt.")}
          {block("Beispiele", eintraege("beispiele"), "Noch keine angelegt.")}
          <p class="fuss">Die Beispiele zeigen erfundene Unternehmen. Saemtliche
          Angaben darin dienen ausschliesslich der Veranschaulichung.</p>
          </main></body></html>"""

          pathlib.Path("_site/index.html").write_text(seite, encoding="utf-8")
          print("Einstiegsseite erzeugt")
          PY

          # ---------------------------------------------------------------
          # Selbstaktualisierung der Vorschau.
          # Die Seite fragt regelmaessig version.txt ab und laedt sich neu,
          # sobald ein neuer Stand veroeffentlicht wurde. So bleibt die
          # Vorschau neben dem Chat aktuell, ohne manuelles Neuladen.
          # Wird ausschliesslich in die Vorschau eingefuegt, nie in die
          # Quelldateien. Was der Kunde spaeter bekommt, enthaelt das nicht.
          # ---------------------------------------------------------------
          printf '%s' "$GITHUB_SHA" > _site/version.txt

          # Projektseiten liegen unter /<repo>/, der Pfad ist damit bekannt.
          VERSION_URL="/${GITHUB_REPOSITORY#*/}/version.txt"

          cat > snippet.html <<SNIP
          <script>
          (function(){"use strict";
            var url="${VERSION_URL}",stand=null,fehler=0;
            function pruefen(){
              fetch(url+"?t="+Date.now(),{cache:"no-store"})
                .then(function(r){return r.ok?r.text():Promise.reject(r.status);})
                .then(function(t){
                  t=t.trim(); fehler=0;
                  if(stand===null){stand=t;return;}
                  if(t!==stand){location.reload();}
                })
                .catch(function(){fehler++;});
            }
            pruefen();
            setInterval(function(){
              if(document.visibilityState==="visible"&&fehler<20){pruefen();}
            },5000);
            document.addEventListener("visibilitychange",function(){
              if(document.visibilityState==="visible"){pruefen();}
            });
          })();
          </script>
          SNIP

          # Vor </body> einsetzen. python3 statt sed, damit der mehrzeilige
          # Block unveraendert eingefuegt wird.
          python3 - "$PWD/snippet.html" <<'PY'
          import pathlib, sys
          snippet = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          n = 0
          for f in pathlib.Path("_site").rglob("*.html"):
              s = f.read_text(encoding="utf-8")
              if "</body>" not in s:
                  print("kein </body>:", f); continue
              f.write_text(s.replace("</body>", snippet + "</body>", 1), encoding="utf-8")
              n += 1
          print("Selbstaktualisierung eingebaut in", n, "Seiten")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
