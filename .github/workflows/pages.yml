# Veroeffentlicht die Kundenentwuerfe als Vorschau ueber GitHub Pages.
# Erreichbar unter https://<benutzer>.github.io/Website-1.0/<kunde>/
name: Vorschau veroeffentlichen

on:
  push:
    branches: [main]
    paths: ['kunden/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seiten zusammenstellen
        run: |
          mkdir -p _site
          cp -r kunden/* _site/

          # Interne Unterlagen gehoeren nicht auf die Vorschau. Die README
          # enthaelt Verkaufsargumente und Notizen zum Kundengespraech, die
          # niemand ausser uns sehen soll.
          find _site \( -name '*.md' -o -name 'README.txt' \) -delete
          echo "Interne Unterlagen entfernt:"
          find _site \( -name '*.md' -o -name 'README.txt' \) | grep . && exit 1 || echo "  keine mehr vorhanden"

          # Vorschau nicht indexieren lassen. Die Quelldateien bleiben
          # unveraendert und damit fuer die spaetere echte Domain korrekt.
          find _site -name '*.html' -print0 | xargs -0 sed -i \
            's|<meta name="robots" content="index, follow">|<meta name="robots" content="noindex, nofollow">|'
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

          # Einstiegsseite mit Uebersicht der Entwuerfe
          {
            printf '<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">'
            printf '<meta name="viewport" content="width=device-width,initial-scale=1">'
            printf '<meta name="robots" content="noindex, nofollow">'
            printf '<title>Entwuerfe</title><style>'
            printf 'body{font:16px/1.6 system-ui,sans-serif;margin:0;padding:3rem 1.5rem;'
            printf 'background:#f3f2ed;color:#12291e}main{max-width:34rem;margin:auto}'
            printf 'h1{font-size:1.6rem;margin:0 0 1.5rem}'
            printf 'a{display:block;padding:1.1rem 1.3rem;margin-bottom:.75rem;background:#fff;'
            printf 'border:1px solid rgba(18,41,30,.12);border-radius:12px;text-decoration:none;'
            printf 'color:inherit;font-weight:600}a:hover{border-color:#e0a02c}'
            printf 'p{color:#4e6157;font-size:.95rem}'
            printf '</style></head><body><main><h1>Website-Entwuerfe</h1>'
            for d in kunden/*/; do
              n=$(basename "$d")
              printf '<a href="./%s/">%s</a>' "$n" "$n"
            done
            printf '<p>Nicht oeffentlich gelistet. Vorschauen fuer die Kundenabstimmung.</p>'
            printf '</main></body></html>'
          } > _site/index.html

          # ---------------------------------------------------------------
          # Selbstaktualisierung der Vorschau.
          # Die Seite fragt regelmaessig version.txt ab und laedt sich neu,
          # sobald ein neuer Stand veroeffentlicht wurde. So bleibt die
          # Vorschau auf dem iPad neben dem Chat immer aktuell, ohne dass
          # jemand manuell neu laden muss.
          # Wird ausschliesslich in die Vorschau eingefuegt, nie in die
          # Quelldateien. Was der Kunde spaeter bekommt, enthaelt das nicht.
          # ---------------------------------------------------------------
          printf '%s' "$GITHUB_SHA" > _site/version.txt

          # Projektseiten liegen unter /<repo>/, der Pfad ist damit bekannt.
          VERSION_URL="/${GITHUB_REPOSITORY#*/}/version.txt"

          cat > snippet.html <<SNIP
          <script>
          (function(){"use strict";
            var url="${VERSION_URL}",stand=null,fehler=0;
            function pruefen(){
              fetch(url+"?t="+Date.now(),{cache:"no-store"})
                .then(function(r){return r.ok?r.text():Promise.reject(r.status);})
                .then(function(t){
                  t=t.trim(); fehler=0;
                  if(stand===null){stand=t;return;}
                  if(t!==stand){location.reload();}
                })
                .catch(function(){fehler++;});
            }
            pruefen();
            setInterval(function(){
              if(document.visibilityState==="visible"&&fehler<20){pruefen();}
            },5000);
            document.addEventListener("visibilitychange",function(){
              if(document.visibilityState==="visible"){pruefen();}
            });
          })();
          </script>
          SNIP

          # Vor </body> einsetzen. python3 statt sed, damit der mehrzeilige
          # Block unveraendert eingefuegt wird.
          python3 - "$PWD/snippet.html" <<'PY'
          import pathlib, sys
          snippet = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          n = 0
          for f in pathlib.Path("_site").rglob("*.html"):
              s = f.read_text(encoding="utf-8")
              if "</body>" not in s:
                  print("kein </body>:", f); continue
              f.write_text(s.replace("</body>", snippet + "</body>", 1), encoding="utf-8")
              n += 1
          print("Selbstaktualisierung eingebaut in", n, "Seiten")
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
